<script>
/* ------------------------------------------------------------------
   BLOG CARDS — one entry per post, newest first.
   The first post is shown as the big featured card.

   To add a post:
   1. Copy blog/why-are-babysitters-so-rare-in-india.html, rename it
      to blog/<your-slug>.html and replace the title, banner and text.
   2. Add an entry below with the same slug.
   `card` is the picture on the card; the banner lives in the post page.
   `cardPosition` (optional) picks which part of the card photo to show.
------------------------------------------------------------------- */
const POSTS = [
  {
    slug: 'why-are-babysitters-so-rare-in-india',
    title: 'Why Are Babysitters So Rare in India?',
    excerpt: 'Urban India has put almost everything on call, from cabs to cooks. So how did we forget to invent the everyday babysitter?',
    category: 'Parenting',
    date: '27 Oct 2026',
    read: '7 min read',
    card: 'assets/banner%20and%20card%20image.jpeg'
  },
];

const CATS = ['All', ...Array.from(new Set(POSTS.map(p => p.category)))];
let activeCat = 'All';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arrow = '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const href = p => '/blog/' + p.slug;
const img = (p, lazy) => `<img src="${esc(p.card)}" alt=""${lazy ? ' loading="lazy"' : ''} style="object-position: ${esc(p.cardPosition || 'center')}">`;

function card(p){
  return `<a class="card fade" href="${href(p)}">
    <div class="cover">${img(p, true)}</div>
    <div class="body"><span class="tag">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p>
    <div class="meta">${esc(p.date)} · ${esc(p.read)}</div></div></a>`;
}

function renderList(){
  const list = POSTS.filter(p => activeCat === 'All' || p.category === activeCat);
  const [first, ...rest] = list;
  app.innerHTML = `
  <header class="hero fade">
    <div class="eyebrow">The Pacifyco Blog</div>
    <h1>Notes for parents who <span>need a breather.</span></h1>
    <div class="script">Grab a chai. Stay a while.</div>
  </header>
  ${CATS.length > 2 ? `<div class="filters" role="group" aria-label="Filter posts">
    ${CATS.map(c => `<button class="chip" type="button" aria-pressed="${c === activeCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
  </div>` : '<div style="height: 34px"></div>'}
  ${first ? `<a class="feature fade" href="${href(first)}">
      <div class="cover">${img(first)}</div>
      <div class="body"><span class="tag">${esc(first.category)}</span><h2>${esc(first.title)}</h2><p>${esc(first.excerpt)}</p>
      <div class="meta">${esc(first.date)} · ${esc(first.read)}</div><span class="read">Read the post ${arrow}</span></div>
    </a>` : `<div class="empty fade"><div class="script" style="font-size: 40px; color: var(--rust); line-height: 1.1">Our first stories are brewing.</div><p style="margin-top: 10px">We’re putting the kettle on and writing up our first posts for parents. Check back soon!</p><a class="btn btn-co" href="/#waitlist" style="margin-top: 22px">Register as a Parent ${arrow}</a></div>`}
  ${rest.length ? `<div class="grid">${rest.map(card).join('')}</div>` : ''}`;
  app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { activeCat = b.dataset.cat; renderList(); }));
}

// Old in-page post links (/blog#slug) now go to the post's own page.
const legacy = POSTS.find(p => p.slug === decodeURIComponent(location.hash.slice(1)));
if (legacy) location.replace(href(legacy)); else renderList();
</script>
